name: Build app icons
on:
  push:
    paths:
      - icon.svg
      - .github/workflows/build-icons.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - run: |
          for size in 180 192 512; do
            rsvg-convert -w "$size" -h "$size" -b '#c8eee3' icon.svg -o "icon-$size.png"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-180.png icon-192.png icon-512.png
          git diff --cached --quiet || (git commit -m "Generate PNG app icons from approved SVG" && git push)
