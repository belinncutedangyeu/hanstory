<style>

max-height:70dvh;overflow:auto;z-index:3;background:white;border:1px solid #c5d7c4;border-radius:13px;padding:15px;box-shadow:0 8px 35px #213b3033}.hidden{display:none}.help{background:#edf3ec;border-radius:8px;padding:12px;margin:10px 0}.tip{border:1px solid #bfd2bf;border-radius:50%;width:22px;height:22px;background:#edf3ec;color:#325d49}.link{color:#2e6452}@media(max-width:700px){.layout{display:block;height:calc(100dvh - 84px)}nav{width:100%;display:flex;flex-direction:row;overflow-x:auto;padding:5px}nav button{white-space:nowrap}main{height:calc(100% - 51px);padding:11px}.grid{grid-template-columns:1fr}h1{font-size:22px}}
header{gap:12px}.hamb{border:1px solid #ffffff66;background:transparent;color:white;border-radius:9px;padding:7px 11px;font-size:20px}.brandgroup{flex:1}.layout{height:calc(100dvh - 84px)}main{padding-bottom:90px}.fabs{z-index:4;bottom:max(18px,env(safe-area-inset-bottom))}.fab{box-shadow:0 3px 12px #193a3029}.shade{display:none}nav.closed{display:none}@media(max-width:1024px){nav{position:fixed;left:0;top:84px;bottom:0;z-index:8;width:min(260px,85vw);flex-direction:column;overflow:auto;box-shadow:8px 0 30px #193a3033}nav.closed{display:none}.shade.open{display:block;position:fixed;inset:84px 0 0;background:#193a3055;z-index:7}.layout{display:block}main{height:100%;padding:14px 14px 90px}}@media(min-width:1025px){.shade{display:none!important}} </style></head><body><header><button class="hamb" id="hamb" aria-label="Danh mục" aria-expanded="false">☰</button><div class="brandgroup"><h1>DIỆU HÂN</h1><small>Không gian sáng tác</small></div><small>V3.2</small></header><div class="layout"><div class="shade" id="shade"></div><nav id="nav"></nav><main id="view"></main></div><div class="fabs"><button class="fab" id="tasks" title="Việc cần theo dõi">☑</button><button class="fab" id="quick" title="Lệnh nhanh">⌘</button><button class="fab min" id="min" title="Trợ lý Min">M</button></div><div id="popup" class="popup hidden"></div>
<script>
(function(){
"use strict";
var KEY="mangatoon_studio_v1",page="dashboard",chosen="",edit="",section="overview";
var nav=[["dashboard","Tổng quan"],["library","Thư viện"],["bible","Hồ sơ"],["writing","Sáng tác"],["editorial","Biên tập"],["canon","Nhất quán"],["publishing","Xuất bản"],["images","Xưởng hình ảnh"],["settings","Cài đặt"]];
var types={NOV:"Tiểu thuyết",CHAT:"Truyện chat",SHORT:"Truyện ngắn"};
var empty=function(){return{novels:[],chapters:[],messages:[],reviews:[],issues:[],schedules:[],images:[]}};
var data;try{data=Object.assign(empty(),JSON.parse(localStorage.getItem(KEY))||{})}catch(e){data=empty()}
function E(id){return document.getElementById(id)}
function X(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert("Lưu thất bại. Hãy sao lưu JSON: "+e.message)}}
function entry(){return data.novels.find(function(n){return n.code===chosen})}
function kind(n){return n.kind||"NOV"}
function code(k){return k+"-"+String(1+Math.max(0,...data.novels.filter(function(n){return n.code.startsWith(k+"-")}).map(function(n){return Number(n.code.split("-")[1])||0}))).padStart(3,"0")}
function guide(t){return '<button class="tip" data-tip="'+X(t)+'" title="Hướng dẫn">ⓘ</button>'}
function selector(){return '<label>Chọn tác phẩm<select id="choose"><option value="">-- Chọn --</option>'+data.novels.map(function(n){return '<option value="'+X(n.code)+'" '+(n.code===chosen?"selected":"")+'>'+X(n.title+" · "+(types[kind(n)]||"Tiểu thuyết"))+'</option>'}).join("")+'</select></label>'}
function field(n,t,v){return '<label>'+n+'<textarea name="'+t+'">'+X(v||"")+'</textarea></label>'}
function list(a,fn){return a.length?a.map(fn).join(""):'<p class="small">Chưa có dữ liệu.</p>'}
function menuOpen(open){E("nav").classList.toggle("closed",!open);E("shade").classList.toggle("open",open);E("hamb").setAttribute("aria-expanded",String(open))}
E("hamb").onclick=function(){menuOpen(E("nav").classList.contains("closed"))};E("shade").onclick=function(){menuOpen(false)};menuOpen(window.innerWidth>1024);
function render(){E("nav").innerHTML=nav.map(function(n){return '<button data-go="'+n[0]+'" class="'+(page===n[0]?"active":"")+'">'+n[1]+'</button>'}).join("");var n=entry(),s="",heading=nav.find(function(x){return x[0]===page})[1];
if(page==="dashboard"){s='<div class="grid">'+Object.keys(types).map(function(k){return '<section class="panel"><h3>'+types[k]+'</h3><h2>'+data.novels.filter(function(n){return kind(n)===k}).length+'</h2></section>'}).join("")+'</div><section class="panel"><h3>Tiếp tục viết</h3>'+list(data.novels,function(n){return '<div class="item"><b>'+X(n.title)+'</b> · <span class="pill">'+types[kind(n)]+'</span> <button class="btn alt" data-open="'+X(n.code)+'">Mở</button></div>'})+'</section>'}
if(page==="library"){s='<div class="grid"><section class="panel"><h3>Tạo tác phẩm '+guide("Mã NOV, CHAT, SHORT tự tăng riêng theo từng loại; bản thảo chỉ lưu trên thiết bị.")+'</h3><form id="create"><label>Loại truyện<select name="kind"><option value="NOV">Tiểu thuyết</option><option value="CHAT">Truyện chat</option><option value="SHORT">Truyện ngắn</option></select></label><label>Tên truyện<input name="title" required maxlength="200"></label><label>Thể loại<input name="genre"></label>'+field("Ý tưởng","idea","")+'<button class="btn">Tạo tác phẩm</button></form></section><section class="panel"><h3>Danh sách tác phẩm</h3>'+list(data.novels,function(n){return '<div class="item"><b>'+X(n.code+" — "+n.title)+'</b><p class="small">'+types[kind(n)]+'</p><button class="btn alt" data-open="'+X(n.code)+'">Sáng tác</button></div>'})+'</section></div>'}
if(!["dashboard","library","settings","images"].includes(page)){s=selector()+(n?"":'<section class="panel">Hãy chọn hoặc tạo tác phẩm trong Thư viện.</section>')}
if(n&&page==="bible"){n.bible=n.bible||{};s+='<section class="panel"><h3>Hồ sơ tác phẩm '+guide("Lưu thông tin gốc về bối cảnh, nhân vật và cốt truyện để đối chiếu khi viết.")+'</h3><div class="row">'+[["overview","Tổng quan"],["characters","Nhân vật"],["plot","Cốt truyện"],["world","Bối cảnh"],["timeline","Dòng thời gian"]].map(function(x){return '<button class="btn alt" data-section="'+x[0]+'">'+x[1]+'</button>'}).join("")+'</div><form id="bibleForm">'+field(section,"body",n.bible[section])+'<button class="btn">Lưu hồ sơ</button></form></section>'}
if(n&&page==="writing"){var cs=data.chapters.filter(function(c){return c.novel===chosen}),cur=cs.find(function(c){return c.id===edit});if(kind(n)==="CHAT"){s+='<section class="panel"><h3>Hội thoại '+guide("Viết từng lượt chat; có thể gõ tên nhân vật và lời thoại rồi lưu.")+'</h3><form id="messageForm"><label>Nhân vật<input name="speaker" required></label>'+field("Lời thoại","body","")+'<button class="btn">Thêm lời thoại</button></form>'+list(data.messages.filter(function(m){return m.novel===chosen}),function(m){return '<div class="item"><b>'+X(m.speaker)+'</b><p>'+X(m.body)+'</p></div>'})+'</section>'}else{s+='<div class="grid"><section class="panel"><h3>Soạn bản thảo '+guide("Nhấn Lưu để ghi vào bộ nhớ thiết bị. Sao lưu JSON định kỳ.")+'</h3><form id="chapterForm"><label>'+(kind(n)==="SHORT"?"Phần":"Chương")+'<input type="number" min="1" name="number" value="'+(cur?X(cur.number):cs.length+1)+'" required></label><label>Phiên bản<input type="number" min="1" name="version" value="'+(cur?X(cur.version):1)+'" required></label><label>Tiêu đề<input name="title" value="'+X(cur?cur.title:"")+'"></label><label>Nội dung<textarea class="editor" name="body">'+X(cur?cur.body:"")+'</textarea></label><button class="btn">Lưu bản thảo</button></form></section><section class="panel"><h3>Chương / phần đã lưu</h3>'+list(cs,function(c){return '<div class="item"><b>'+X(c.title||"Chương "+c.number)+'</b> · v'+X(c.version)+' <button class="btn alt" data-edit="'+X(c.id)+'">Sửa</button></div>'})+'</section></div>'}}
if(n&&page==="editorial"){s+='<section class="panel"><h3>Ghi chú biên tập '+guide("Ghi góp ý, lỗi logic, nhịp truyện hoặc văn phong; dữ liệu chỉ lưu cục bộ.")+'</h3><form id="reviewForm">'+field("Nhận xét","body","")+'<button class="btn">Lưu nhận xét</button></form>'+list(data.reviews.filter(function(r){return r.novel===chosen}),function(r){return '<div class="item">'+X(r.body)+'</div>'})+'</section>'}
if(n&&page==="canon"){s+='<section class="panel"><h3>Kiểm tra tính nhất quán '+guide("Đây là sổ theo dõi thủ công; chưa có AI tự rà soát.")+'</h3><form id="issueForm">'+field("Mâu thuẫn hoặc chi tiết cần xác minh","body","")+'<button class="btn">Ghi nhận</button></form>'+list(data.issues.filter(function(i){return i.novel===chosen}),function(i){return '<div class="item">'+X(i.body)+'</div>'})+'</section>'}
if(n&&page==="publishing"){s+='<section class="panel"><h3>Lịch xuất bản '+guide("Lưu lịch dự kiến, không tự động đăng lên MangaToon.")+'</h3><form id="scheduleForm"><label>Tên chương<input name="title" required></label><label>Ngày đăng<input type="date" name="date" required></label><button class="btn">Lưu lịch</button></form>'+list(data.schedules.filter(function(z){return z.novel===chosen}),function(z){return '<div class="item">'+X(z.date+" — "+z.title)+'</div>'})+'<p><a class="link" href="https://mangatoon.mobi/" target="_blank" rel="noopener">Mở MangaToon ↗</a></p></section>'}
if(page==="images"){s=selector()+'<section class="panel"><h3>Xưởng hình ảnh '+guide("Tạo yêu cầu hình ảnh, mở AI bên ngoài rồi nhập ảnh đã tạo. Không gọi API trực tiếp.")+'</h3><label>Loại ảnh<select id="imageType"><option>Ảnh bìa</option><option>Nhân vật</option><option>Bối cảnh</option><option>Avatar / sticker</option></select></label><label>Mô tả hình ảnh<textarea id="imageDesc" placeholder="Phong cách, màu sắc, nhân vật, bố cục..."></textarea></label><div class="row"><button class="btn" id="imagePrompt">Sao chép yêu cầu</button><a class="link" href="https://chatgpt.com/" target="_blank" rel="noopener">ChatGPT ↗</a><a class="link" href="https://gemini.google.com/" target="_blank" rel="noopener">Gemini ↗</a></div></section><section class="panel"><h3>Thư viện ảnh</h3><label>Tên ảnh<input id="imageName"></label><label>Nhập ảnh từ thiết bị<input id="imageUpload" type="file" accept="image/png,image/jpeg,image/webp"></label><p class="small">Ảnh được nén và lưu cục bộ; nên sao lưu JSON thường xuyên.</p><div class="grid">'+list(data.images.filter(function(i){return !chosen||i.novel===chosen}),function(i){return '<div class="item"><img style="width:100%;max-height:240px;object-fit:contain" src="'+X(i.src)+'" alt="'+X(i.name)+'"><p>'+X(i.name)+'</p><span class="pill">'+X(i.type)+'</span> <button class="btn alt" data-remove-image="'+X(i.id)+'">Xóa</button></div>'})+'</div></section>'}
if(page==="settings"){s='<section class="panel"><h3>Sao lưu '+guide("Dữ liệu LocalStorage không đồng bộ giữa iPhone và iPad. Nên tải JSON thường xuyên.")+'</h3><p>Dữ liệu lưu trên trình duyệt hiện tại, chưa có máy chủ đồng bộ.</p><button class="btn" id="export">Tải JSON</button><label>Khôi phục JSON<input type="file" id="import" accept=".json"></label></section><section class="panel"><h3>Liên kết nền tảng</h3><p><a class="link" href="https://chatgpt.com/" target="_blank" rel="noopener">ChatGPT</a> · <a class="link" href="https://gemini.google.com/" target="_blank" rel="noopener">Gemini</a> · <a class="link" href="https://mangatoon.mobi/" target="_blank" rel="noopener">MangaToon</a></p><p class="small">Các liên kết chỉ mở trang tương ứng, không kết nối API.</p></section>'}
E("view").innerHTML='<h2>'+heading+'</h2>'+s;
E("nav").querySelectorAll("[data-go]").forEach(function(b){b.onclick=function(){page=b.dataset.go;edit="";if(window.innerWidth<=1024)menuOpen(false);render()}});
E("view").querySelectorAll("[data-open]").forEach(function(b){b.onclick=function(){chosen=b.dataset.open;page="writing";edit="";render()}});
E("view").querySelectorAll("[data-edit]").forEach(function(b){b.onclick=function(){edit=b.dataset.edit;render()}});
E("view").querySelectorAll("[data-section]").forEach(function(b){b.onclick=function(){section=b.dataset.section;render()}});
E("view").querySelectorAll("[data-tip]").forEach(function(b){b.onclick=function(){popup('<h3>Hướng dẫn</h3><div class="help">'+X(b.dataset.tip)+'</div>')}});
if(E("choose"))E("choose").onchange=function(){chosen=this.value;edit="";render()};
function form(id,fn){var f=E(id);if(f)f.onsubmit=function(e){e.preventDefault();fn(Object.fromEntries(new FormData(f).entries()))}}
form("create",function(v){var k=v.kind,nn={code:code(k),kind:k,title:v.title,genre:v.genre,idea:v.idea,bible:{overview:v.idea},updated:new Date().toISOString()};data.novels.push(nn);chosen=nn.code;save();page="bible";render()});
form("bibleForm",function(v){n.bible=n.bible||{};n.bible[section]=v.body;save();render()});
form("chapterForm",function(v){var c=data.chapters.find(function(z){return z.id===edit});if(!c){c={id:String(Date.now())+Math.random().toString(36).slice(2),novel:chosen};data.chapters.push(c)}Object.assign(c,{number:Number(v.number),version:Number(v.version),title:v.title,body:v.body});save();edit="";render()});
form("messageForm",function(v){data.messages.push({novel:chosen,speaker:v.speaker,body:v.body});save();render()});
form("reviewForm",function(v){data.reviews.push({novel:chosen,body:v.body});save();render()});
form("issueForm",function(v){data.issues.push({novel:chosen,body:v.body});save();render()});
form("scheduleForm",function(v){data.schedules.push({novel:chosen,title:v.title,date:v.date});save();render()});
if(E("imagePrompt"))E("imagePrompt").onclick=function(){var n=entry(),p="Tạo "+E("imageType").value+" cho tác phẩm "+(n?n.title:"chưa chọn")+". Mô tả: "+E("imageDesc").value+". Hồ sơ: "+(n?JSON.stringify(n.bible||{}):"");if(navigator.clipboard)navigator.clipboard.writeText(p).then(function(){alert("Đã sao chép")}).catch(function(){prompt("Sao chép yêu cầu",p)});else prompt("Sao chép yêu cầu",p)};
if(E("imageUpload"))E("imageUpload").onchange=function(e){var f=e.target.files[0];if(!f)return;if(!["image/png","image/jpeg","image/webp"].includes(f.type)||f.size>20000000){alert("Chọn PNG, JPEG hoặc WebP dưới 20 MB.");return}var url=URL.createObjectURL(f),im=new Image(),name=E("imageName").value||f.name,type=E("imageType").value,novel=chosen;im.onload=function(){try{var scale=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(im.width*scale));c.height=Math.max(1,Math.round(im.height*scale));c.getContext("2d").drawImage(im,0,0,c.width,c.height);var src=c.toDataURL("image/webp",.75),record={id:String(Date.now())+Math.random().toString(36).slice(2),name:name,type:type,novel:novel,src:src};data.images.push(record);try{localStorage.setItem(KEY,JSON.stringify(data))}catch(err){data.images.pop();alert("Bộ nhớ đầy. Hãy sao lưu và giảm số ảnh.");return}render()}finally{URL.revokeObjectURL(url)}};im.onerror=function(){URL.revokeObjectURL(url);alert("Không đọc được ảnh")};im.src=url};
E("view").querySelectorAll("[data-remove-image]").forEach(function(b){b.onclick=function(){if(confirm("Xóa ảnh này?")){data.images=data.images.filter(function(i){return i.id!==b.dataset.removeImage});save();render()}}});
if(E("export"))E("export").onclick=function(){var b=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download="dieu-han-backup.json";a.click();setTimeout(function(){URL.revokeObjectURL(u)},1000)};
if(E("import"))E("import").onchange=function(e){var f=e.target.files[0];if(!f)return;f.text().then(function(t){var d=JSON.parse(t);if(!Array.isArray(d.novels)||!Array.isArray(d.chapters))throw Error("JSON không hợp lệ");if(confirm("Ghi đè dữ liệu hiện tại?")){data=Object.assign(empty(),d);save();render()}}).catch(function(x){alert(x.message)})}
}
function popup(html){E("popup").innerHTML='<button class="btn alt" id="close">Đóng ×</button>'+html;E("popup").classList.remove("hidden");E("close").onclick=function(){E("popup").classList.add("hidden")}}
E("tasks").onclick=function(){popup('<h3>Việc cần theo dõi</h3><p>Ghi chú nhất quán: '+data.issues.length+'</p><p>Lịch xuất bản: '+data.schedules.length+'</p>')};
E("quick").onclick=function(){popup('<h3>Lệnh nhanh</h3>'+nav.map(function(n){return '<p><button class="btn alt" data-jump="'+n[0]+'">'+n[1]+'</button></p>'}).join(""));E("popup").querySelectorAll("[data-jump]").forEach(function(b){b.onclick=function(){page=b.dataset.jump;E("popup").classList.add("hidden");render()}})};
E("min").onclick=function(){popup('<h3>Min · Trợ lý sáng tác</h3><p class="small">Soạn yêu cầu và sao chép sang AI bên ngoài.</p><label>Nhiệm vụ<select id="minTask"><option>Phát triển ý tưởng</option><option>Biên tập</option><option>Kiểm tra logic</option><option>Chuẩn bị xuất bản</option></select></label><label>Yêu cầu<textarea id="minRequest"></textarea></label><div class="row"><button class="btn" id="minCopy">Sao chép</button><a class="link" href="https://chatgpt.com/" target="_blank" rel="noopener">ChatGPT ↗</a><a class="link" href="https://gemini.google.com/" target="_blank" rel="noopener">Gemini ↗</a></div>');E("minCopy").onclick=function(){var n=entry(),p="Bạn là Min, trợ lý sáng tác của Diệu Hân. Tác phẩm: "+(n?n.title:"chưa chọn")+". Hồ sơ tác phẩm: "+(n?JSON.stringify(n.bible||{}):"chưa có")+". Nhiệm vụ: "+E("minTask").value+". Yêu cầu: "+E("minRequest").value+". Không tự bịa canon.";if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(p).then(function(){alert("Đã sao chép")}).catch(function(){prompt("Sao chép nội dung:",p)})}else prompt("Sao chép nội dung:",p)}};
