<script>
(function(){
"use strict";
var KEY="mangatoon_studio_v1",page="dashboard",chosen="",edit="",section="overview";
var nav=[["dashboard","Tổng quan"],["library","Thư viện"],["bible","Hồ sơ"],["writing","Sáng tác"],["editorial","Biên tập"],["canon","Nhất quán"],["publishing","Xuất bản"],["images","Xưởng hình ảnh"],["settings","Cài đặt"]];
var types={NOV:"Tiểu thuyết",CHAT:"Truyện chat",SHORT:"Truyện ngắn"};
var empty=function(){return{novels:[],chapters:[],messages:[],reviews:[],issues:[],schedules:[],images:[],characters:[]}};
var data;try{data=Object.assign(empty(),JSON.parse(localStorage.getItem(KEY))||{})}catch(e){data=empty()}
function E(id){return document.getElementById(id)}
function X(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
var db=null,dbQueue=Promise.resolve(),dbReady=false,studioLoaded=false,studioReadOnly=false;
function openStudioDB(){return new Promise(function(resolve,reject){if(!window.indexedDB)return reject(Error("IndexedDB không hỗ trợ"));var q=indexedDB.open("hanstory-studio",1);q.onupgradeneeded=function(){q.result.createObjectStore("studio")};q.onsuccess=function(){resolve(q.result)};q.onerror=function(){reject(q.error)};q.onblocked=function(){reject(Error("Cơ sở dữ liệu đang bị khóa"))}})}
function dbRead(){return new Promise(function(resolve,reject){var t=db.transaction("studio","readonly"),q=t.objectStore("studio").get("main");q.onsuccess=function(){resolve(q.result)};q.onerror=function(){reject(q.error)}})}
function dbWrite(value){var snapshot=JSON.stringify(value);var job=dbQueue.catch(function(){}).then(function(){return new Promise(function(resolve,reject){var t=db.transaction("studio","readwrite");t.objectStore("studio").put(snapshot,"main");t.oncomplete=resolve;t.onerror=t.onabort=function(){reject(t.error||Error("Không thể ghi dữ liệu"))}})});dbQueue=job;return job}
function save(){if(!studioLoaded||studioReadOnly){alert("Chưa thể ghi dữ liệu. Hãy mở lại ứng dụng.");return Promise.resolve(false)}if(dbReady){return dbWrite(data).catch(function(e){alert("Lưu IndexedDB thất bại. Hãy sao lưu JSON ngay: "+e.message);return false})}try{localStorage.setItem(KEY,JSON.stringify(data));return Promise.resolve(true)}catch(e){alert("Lưu thất bại. Hãy sao lưu JSON: "+e.message);return Promise.resolve(false)}}
async function startStudio(){E("view").textContent="Đang mở dữ liệu sáng tác…";["quick","min","tasks"].forEach(function(k){E(k).disabled=true});try{db=await openStudioDB();var saved=await dbRead();if(saved!==undefined){var parsed=JSON.parse(saved);if(!parsed||!Array.isArray(parsed.novels)||!Array.isArray(parsed.chapters))throw Error("Dữ liệu IndexedDB không hợp lệ");data=Object.assign(empty(),parsed)}else{await dbWrite(data)}dbReady=true}catch(e){studioReadOnly=true;E("view").textContent="Không mở được dữ liệu chính. Bản dự phòng chưa bị thay đổi.";var retry=document.createElement("button");retry.className="btn";retry.textContent="Thử mở lại";retry.onclick=function(){location.reload()};E("view").appendChild(retry);var backup=document.createElement("button");backup.className="btn";backup.textContent="Xuất bản dự phòng LocalStorage";backup.onclick=downloadBackup;E("view").appendChild(backup);return}studioLoaded=true;["quick","min","tasks"].forEach(function(k){E(k).disabled=false});chosen=data.novels[0]?data.novels[0].code:"";render()}
function entry(){return data.novels.find(function(n){return n.code===chosen})}
function kind(n){return n.kind||"NOV"}
function code(k){return k+"-"+String(1+Math.max(0,...data.novels.filter(function(n){return n.code.startsWith(k+"-")}).map(function(n){return Number(n.code.split("-")[1])||0}))).padStart(3,"0")}
function guide(t){return '<button class="tip" data-tip="'+X(t)+'" title="Hướng dẫn">ⓘ</button>'}
function selector(){return '<label>Chọn tác phẩm<select id="choose"><option value="">-- Chọn --</option>'+data.novels.map(function(n){return '<option value="'+X(n.code)+'" '+(n.code===chosen?"selected":"")+'>'+X(n.title+" · "+(types[kind(n)]||"Tiểu thuyết"))+'</option>'}).join("")+'</select></label>'}
function field(n,t,v){return '<label>'+n+'<textarea name="'+t+'">'+X(v||"")+'</textarea></label>'}
function list(a,fn){return a.length?a.map(fn).join(""):'<p class="small">Chưa có dữ liệu.</p>'}
function menuOpen(open){E("nav").classList.toggle("closed",!open);E("shade").classList.toggle("open",open);E("hamb").setAttribute("aria-expanded",String(open))}
E("hamb").onclick=function(){menuOpen(E("nav").classList.contains("closed"))};E("shade").onclick=function(){menuOpen(false)};menuOpen(window.innerWidth>1024);
function downloadBackup(){try{var drafts={};for(var j=0;j<localStorage.length;j++){var k=localStorage.key(j);if(k.startsWith("hanstory-draft-"))drafts[k]=localStorage.getItem(k)}var backup={format:"hanstory-backup",version:1,createdAt:new Date().toISOString(),data:data,drafts:drafts,theme:document.documentElement.dataset.theme};var b=new Blob([JSON.stringify(backup,null,2)],{type:"application/json"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download="dieu-han-backup-"+new Date().toISOString().slice(0,10)+".json";a.click();try{localStorage.setItem("hanstory-last-backup",String(Date.now()))}catch(e){}setTimeout(function(){URL.revokeObjectURL(u)},1000)}catch(err){alert("Không thể sao lưu: "+err.message)}};
function studioField(label,key,value){return '<label>'+X(label)+'<input name="'+key+'" value="'+X(value||"")+'"></label>'}
function studioSelect(label,key,values,current){return '<label>'+X(label)+'<select name="'+key+'">'+values.map(function(v){return '<option '+(v===current?'selected':'')+'>'+X(v)+'</option>'}).join("")+'</select></label>'}
function studioRecords(n,key){return (n[key]||(n[key]=[]))}
function studioId(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}
function recordPanel(n,key,title,fields){var rows=studioRecords(n,key);return '<section class="panel"><h3>'+title+'</h3><form id="recordForm" data-record="'+key+'"><input type="hidden" name="id">'+fields.map(function(f){return f[2]?field(f[0],f[1],""):studioField(f[0],f[1],"")}).join("")+'<button class="btn">Lưu mục</button> <button type="reset" class="btn alt">Mục mới</button></form>'+list(rows,function(v){return '<div class="item"><b>'+X(v[fields[0][1]]||"Chưa đặt tên")+'</b><p class="small">'+X(v[fields[1][1]]||"")+'</p><button class="btn alt" data-record-edit="'+X(v.id)+'">Sửa</button> <button class="btn alt" data-record-delete="'+X(v.id)+'">Xóa</button></div>'})+'</section>'}
function render(){if(!studioLoaded||studioReadOnly)return;document.body.classList.remove("writing-focus");E("nav").innerHTML=nav.map(function(n){return '<button data-go="'+n[0]+'" class="'+(page===n[0]?"active":"")+'">'+n[1]+'</button>'}).join("");var n=entry(),s="",heading=nav.find(function(x){return x[0]===page})[1];
if(page==="dashboard"){s='<div class="grid">'+Object.keys(types).map(function(k){return '<section class="panel"><h3>'+types[k]+'</h3><h2>'+data.novels.filter(function(n){return kind(n)===k}).length+'</h2></section>'}).join("")+'</div><section class="panel"><h3>Tiếp tục viết</h3>'+list(data.novels,function(n){return '<div class="item"><b>'+X(n.title)+'</b> · <span class="pill">'+types[kind(n)]+'</span> <button class="btn alt" data-open="'+X(n.code)+'">Mở</button></div>'})+'</section>'}
if(page==="library"){s='<div class="grid"><section class="panel"><h3>Tạo tác phẩm '+guide("Mã NOV, CHAT, SHORT tự tăng riêng theo từng loại; bản thảo chỉ lưu trên thiết bị.")+'</h3><form id="create"><label>Loại truyện<select name="kind"><option value="NOV">Tiểu thuyết</option><option value="CHAT">Truyện chat</option><option value="SHORT">Truyện ngắn</option></select></label><label>Tên truyện<input name="title" required maxlength="200"></label><label>Thể loại<input name="genre"></label>'+field("Ý tưởng","idea","")+'<button class="btn">Tạo tác phẩm</button></form></section><section class="panel"><h3>Danh sách tác phẩm</h3><label>Tìm kiếm<input id="librarySearch" placeholder="Tên, mã, thể loại"></label><label>Lọc loại<select id="libraryFilter"><option value="">Tất cả</option><option value="NOV">Tiểu thuyết</option><option value="CHAT">Truyện chat</option><option value="SHORT">Truyện ngắn</option></select></label>'+list(data.novels,function(n){return '<div class="item" data-library-kind="'+X(kind(n))+'" data-library-text="'+X([n.code,n.title,n.genre,n.state].join(' ').toLowerCase())+'"><b>'+X(n.code+" — "+n.title)+'</b><p class="small">'+types[kind(n)]+'</p><button class="btn alt" data-open="'+X(n.code)+'">Sáng tác</button></div>'})+'</section></div>'}
if(!["dashboard","library","settings","images"].includes(page)){s=selector()+(n?"":'<section class="panel">Hãy chọn hoặc tạo tác phẩm trong Thư viện.</section>')}
if(n&&page==="bible"){n.bible=n.bible||{};s+='<section class="panel"><h3>Hồ sơ tác phẩm</h3><div class="row">'+[["overview","Tổng quan"],["characters","Nhân vật"],["plot","Cốt truyện"],["world","Bối cảnh"],["timeline","Dòng thời gian"],["scenes","Phân cảnh"]].map(function(x){return '<button class="btn '+(section===x[0]?"":"alt")+'" data-section="'+x[0]+'">'+x[1]+'</button>'}).join("")+'</div><form id="bibleForm">'+field("Ghi chú "+section,"body",n.bible[section])+'<button class="btn">Lưu hồ sơ</button></form></section>';
if(section==="overview"){s+='<section class="panel"><h3>Thông tin chuyên sâu</h3><form id="profileForm">'+studioField("Tên tác phẩm","title",n.title)+studioField("Thể loại","genre",n.genre)+studioSelect("Trạng thái","state",["Ý tưởng","Đang viết","Tạm dừng","Hoàn thành"],n.state)+studioField("Đối tượng độc giả","audience",n.audience)+studioField("Chủ đề","theme",n.theme)+studioField("Ngôi kể","pov",n.pov)+field("Tóm tắt","synopsis",n.synopsis)+field("Định hướng văn phong","voice",n.voice)+'<button class="btn">Lưu thông tin</button></form></section>'}
if(section==="characters"){s+='<section class="panel"><h3>Hồ sơ nhân vật</h3><form id="characterForm"><input type="hidden" name="original">'+studioField("Tên nhân vật","name","")+studioField("Vai trò","role","")+studioField("Tuổi / giai đoạn","age","")+studioField("Ngoại hình","appearance","")+field("Tính cách","personality","")+field("Mục tiêu và xung đột","goal","")+field("Quan hệ","relations","")+field("Tiểu sử","history","")+'<label>Ảnh đại diện<select name="avatar"><option value="">Không chọn</option>'+data.images.filter(function(i){return i.novel===chosen}).map(function(i){return '<option value="'+X(i.id)+'">'+X(i.name)+'</option>'}).join("")+'</select></label><button class="btn">Lưu nhân vật</button> <button type="reset" class="btn alt">Nhân vật mới</button></form>'+list(data.characters.filter(function(c){return c.novel===chosen}),function(c){return '<div class="item"><b>'+X(c.name)+'</b><p>'+X(c.role||"")+'</p><button class="btn alt" data-character-edit="'+X(c.name)+'">Sửa hồ sơ</button></div>'})+'</section>'}
if(section==="world")s+=recordPanel(n,"worldRecords","Địa điểm, tổ chức và quy luật",[["Tên","name"],["Loại","type"],["Mô tả","description",true],["Quy luật / giới hạn","rules",true]]);
if(section==="plot")s+=recordPanel(n,"plotRecords","Tuyến truyện",[["Tên tuyến","name"],["Giai đoạn","stage"],["Xung đột","conflict",true],["Kết quả dự kiến","outcome",true]]);
if(section==="timeline")s+=recordPanel(n,"timelineRecords","Mốc thời gian",[["Sự kiện","name"],["Thời điểm / thứ tự","time"],["Nhân vật liên quan","people"],["Hệ quả","effect",true]]);
if(section==="scenes")s+=recordPanel(n,"sceneRecords","Phân cảnh",[["Tên cảnh","name"],["Chương / phần","chapter"],["Góc nhìn","pov"],["Mục tiêu cảnh","goal",true],["Diễn biến","body",true],["Trạng thái","status"]]);}
