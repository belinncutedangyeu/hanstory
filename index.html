<script>
(function(){

var KEY="mangatoon_studio_v1",page="dashboard",chosen="",edit="",section="overview";

function X(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}

function code(k){return k+"-"+String(1+Math.max(0,...data.novels.filter(function(n){return n.code.startsWith(k+"-")}).map(function(n){return Number(n.code.split("-")[1])||0}))).padStart(3,"0")}

function field(n,t,v){return '<label>'+n+'<textarea name="'+t+'">'+X(v||"")+'</textarea></label>'}
function list(a,fn){return a.length?a.map(fn).join(""):'<p class="small">Chưa có dữ liệu.</p>'}

if(n&&page==="bible"){s+='<section class="panel"><h3>Nhân vật và avatar</h3><form id="characterForm"><label>Tên nhân vật<input name="name" required></label><label>Ảnh đại diện<select name="avatar"><option value="">Không chọn</option>'+data.images.filter(function(i){return i.novel===chosen}).map(function(i){return '<option value="'+X(i.id)+'">'+X(i.name)+'</option>'}).join("")+'</select></label><button class="btn">Lưu nhân vật</button></form>'+list(data.characters.filter(function(c){return c.novel===chosen}),function(c){return '<div class="item">'+X(c.name)+'</div>'})+'</section>'}
if(n&&page==="writing"){var cs=data.chapters.filter(function(c){return c.novel===chosen}),cur=cs.find(function(c){return c.id===edit});if(kind(n)==="CHAT"){s+='<section class="panel"><h3>Hội thoại '+guide("Viết từng lượt chat; có thể gõ tên nhân vật và lời thoại rồi lưu.")+'</h3><form id="messageForm"><label>Nhân vật<input name="speaker" list="characterNames" required><datalist id="characterNames">'+data.characters.filter(function(c){return c.novel===chosen}).map(function(c){return '<option value="'+X(c.name)+'">'}).join("")+'</datalist></label>'+field("Lời thoại","body","")+'<button class="btn">Thêm lời thoại</button></form>'+list(data.messages.filter(function(m){return m.novel===chosen}),function(m){var c=data.characters.find(function(c){return c.novel===chosen&&c.name===m.speaker}),im=c&&data.images.find(function(i){return i.id===c.avatar});return '<div class="chatline '+(data.messages.filter(function(z){return z.novel===chosen}).findIndex(function(z){return z.speaker===m.speaker})%2?"alt":"")+'">'+(im?'<img class="avatar" src="'+X(im.src)+'" alt="">':"")+'<div class="chatbubble"><b>'+X(m.speaker)+'</b>'+X(m.body)+'</div></div>'})+'</section>'}else{s+='<div class="grid"><section class="panel"><h3>Soạn bản thảo '+guide("Nhấn Lưu để ghi vào bộ nhớ thiết bị. Sao lưu JSON định kỳ.")+'</h3><form id="chapterForm"><label>'+(kind(n)==="SHORT"?"Phần":"Chương")+'<input type="number" min="1" name="number" value="'+(cur?X(cur.number):Math.max(0,...cs.map(function(c){return Number(c.number)||0}))+1)+'" required></label><label>Phiên bản<input type="number" min="1" name="version" value="'+(cur?X(cur.version):1)+'" required></label><label>Tiêu đề<input name="title" value="'+X(cur?cur.title:"")+'"></label><label>Nội dung<textarea class="editor" name="body">'+X(cur?cur.body:"")+'</textarea></label><p class="draftnote" id="draftNote">0 từ · Bản nháp tự lưu trên thiết bị</p><button class="btn">Lưu bản thảo</button> <button type="button" class="btn alt" id="newVersion">Tạo phiên bản mới</button></form></section><section class="panel"><h3>Chương / phần đã lưu</h3>'+list(cs,function(c){return '<div class="item"><b>'+X(c.title||"Chương "+c.number)+'</b> · v'+X(c.version)+' · '+X(c.status||"Bản nháp")+' <button class="btn alt" data-edit="'+X(c.id)+'">Sửa</button> <button class="btn alt" data-approve="'+X(c.id)+'">Duyệt</button> <button class="btn alt" data-published="'+X(c.id)+'">Đã đăng</button></div>'})+'</section></div>'}}
if(n&&page==="editorial"){s+='<section class="panel"><h3>Ghi chú biên tập '+guide("Ghi góp ý, lỗi logic, nhịp truyện hoặc văn phong; dữ liệu chỉ lưu cục bộ.")+'</h3><form id="reviewForm">'+field("Nhận xét","body","")+'<button class="btn">Lưu nhận xét</button></form>'+list(data.reviews.filter(function(r){return r.novel===chosen}),function(r){return '<div class="item">'+X(r.body)+'</div>'})+'</section>'}
if(n&&page==="canon"){s+='<section class="panel"><h3>Kiểm tra tính nhất quán '+guide("Đây là sổ theo dõi thủ công; chưa có AI tự rà soát.")+'</h3><form id="issueForm">'+field("Mâu thuẫn hoặc chi tiết cần xác minh","body","")+'<button class="btn">Ghi nhận</button></form>'+list(data.issues.filter(function(i){return i.novel===chosen}),function(i){return '<div class="item">'+X(i.body)+'</div>'})+'</section>'}
